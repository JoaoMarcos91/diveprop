  <div id="fatal" hidden></div>
  <noscript><div id="fatal">O DiveProp precisa de JavaScript ligado no navegador.</div></noscript>
  <button id="fs" title="Tela cheia">⛶</button>
  <script>
    // iPhone não deixa a página entrar em tela cheia: esconde o botão
    if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) document.getElementById('fs').hidden = true;
    document.getElementById('fs').addEventListener('click', () => {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    });
    addEventListener('contextmenu', e => e.preventDefault());
  </script>
