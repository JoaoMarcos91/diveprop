<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d10">
  <title>FPVsim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cg stroke='%23ffcc33' stroke-width='5' fill='none'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Ccircle cx='48' cy='16' r='9'/%3E%3Ccircle cx='16' cy='48' r='9'/%3E%3Ccircle cx='48' cy='48' r='9'/%3E%3Cpath d='M22 22l20 20M42 22L22 42'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="osd"></div>
  <div id="ui"></div>
  <pre id="fatal" hidden></pre>
  <button id="fs" title="Tela cheia">⛶</button>
  <script type="module" src="/src/main.js"></script>
  <script>
    document.getElementById('fs').addEventListener('click', () => {
      const el = document.documentElement;
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    });
    addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
